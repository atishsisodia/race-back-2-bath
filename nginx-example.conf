# Example Nginx setup. Spectators visit https://race.example.com
# Organisers use Traccar at https://track.example.com
# Get certificates with:  sudo certbot --nginx -d race.example.com -d track.example.com

server {
    server_name race.example.com;
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }
    # No extra caching needed: the feed is built once per poll and served from memory.
}

server {
    server_name track.example.com;
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;     # Traccar's live map uses WebSockets
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
